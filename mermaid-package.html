<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid Paketdiagramm-Editor</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="mermaid-editor.css">
</head>
<body>
<main>
  <nav>
    <a href="index.html">Übersicht</a>
    <a href="mermaid-seq.html">Sequenzdiagramm</a>
    <a href="mermaid-class.html">Klassendiagramm</a>
    <a href="mermaid-package.html" aria-current="page">Paketdiagramm</a>
  </nav>
  <h1>Mermaid Paketdiagramm-Editor</h1>
  <p class="sub">Mermaid hat keinen eigenen Paketdiagramm-Typ – Pakete werden als <code>subgraph</code> eines Flowcharts modelliert, Abhängigkeiten als gestrichelte Kanten (<code>-.-&gt;</code>).</p>

  <div class="editor">
    <div class="gutter" id="gutter">1</div>
    <div class="code">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Mermaid-Code">
flowchart TB
    %% Beispiel: Schichtenarchitektur
    subgraph app["app"]
        direction TB
        subgraph ui["ui"]
            Views
            Controller
        end
        subgraph domain["domain"]
            Model
            Services
        end
        subgraph persistence["persistence"]
            Repositories
        end
    end
    subgraph ext["extern"]
        JDBC["java.sql"]
    end

    ui -.->|«use»| domain
    persistence -.->|«use»| domain
    persistence -.->|«import»| ext</textarea>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" id="renderBtn">Render</button>
    <button id="copyBtn">Copy to Clipboard</button>
    <span class="hint">Strg+Enter = Render</span>
    <span class="status" id="status"></span>
  </div>

  <div class="output" id="output"></div>
</main>

<script src="vendor/mermaid.min.js"></script>
<script src="mermaid-editor.js" data-lang="package"></script>
</body>
</html>
